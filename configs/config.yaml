server:
  name: swarmos-control-plane
  environment: development
  http_addr: 0.0.0.0:8080
  grpc_addr: 0.0.0.0:9090
  # 控制台生产构建由控制面同源托管；API 路由优先于 SPA 回退路由。
  web_dir: ./web/dist
  shutdown_timeout: 10s

data:
  # 这里只能放本地开发默认值；部署环境必须通过环境变量覆盖密码。
  database_dsn: postgres://swarmos:swarmos@127.0.0.1:55432/swarmos?sslmode=disable
  redis_addr: 127.0.0.1:56379
  redis_password: ""
  nats_url: nats://127.0.0.1:54222

runtime:
  heartbeat_timeout: 60s
  lease_ttl: 30s
  reconcile_interval: 5s
  outbox_interval: 1s

temporal:
  # 默认关闭以兼容未部署 Temporal 的旧环境；生产启用后新 Run 默认使用 Durable Runtime。
  enabled: false
  address: 127.0.0.1:7233
  namespace: default
  task_queue: swarmos-runs-v1-5

security:
  # API Key 只能通过 SWARMOS_API_KEY 注入；这里仅声明默认租户和审计主体。
  tenant_id: 00000000-0000-0000-0000-000000000001
  subject: api-operator

worker:
  # 多个 Worker 使用同一个 Durable 名称，JetStream 会把任务在进程间均衡分配。
  durable: swarmos-workers
  concurrency: 4
  heartbeat_interval: 10s
  ack_wait: 30s
  # 默认只允许同机 Prometheus 抓取；如需远程抓取请显式覆盖监听地址并配置防火墙。
  metrics_addr: 127.0.0.1:9465

observability:
  # 生产默认采样 10%；错误 Span 仍会记录状态，OTLP 端点通过标准环境变量注入。
  trace_sample_ratio: 0.1
